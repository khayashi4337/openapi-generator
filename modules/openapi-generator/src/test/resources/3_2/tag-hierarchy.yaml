    summary: Pets Summary
    description: Pet operations
    kind: nav
  - name: dogs
    parent: pets
  - name: puppies
    parent: dogs
  - name: orphan
    parent: missing
  - name: a
    parent: b
  - name: b
    parent: a
paths:
