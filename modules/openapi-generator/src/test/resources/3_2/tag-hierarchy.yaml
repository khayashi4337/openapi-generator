      tags:
        - dogs
      responses:
        '200':
          description: ok
  /puppies:
    get:
      operationId: listPuppies
      tags:
        - puppies
      responses:
        '200':
          description: ok
  /orphan:
    get:
      operationId: showOrphan
      tags:
        - orphan
      responses:
        '200':
          description: ok
  /a:
    get:
      operationId: opA
      tags:
        - a
      responses:
        '200':
          description: ok
  /b:
    get:
      operationId: opB
      tags:
        - b
      responses:
        '200':
          description: ok
