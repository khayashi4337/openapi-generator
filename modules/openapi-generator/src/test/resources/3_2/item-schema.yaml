openapi: 3.2.0
info:
  title: itemSchema test
  version: '1.0'
paths:
  /events/stream:
    get:
      operationId: streamEvents
      responses:
        '200':
          description: JSONL stream of events
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/Event'
  /events:
    get:
      operationId: listEvents
      responses:
        '200':
          description: SSE stream first, JSON array fallback second
          content:
            text/event-stream:
              itemSchema:
                title: StreamEvent
                type: object
                properties:
                  data:
                    type: string
                  retry:
                    type: integer
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/batch:
    get:
      operationId: getEventBatch
      responses:
        '200':
          description: sequential media type declaring both schema and itemSchema
          content:
            application/json-seq:
              schema:
                $ref: '#/components/schemas/EventBatch'
              itemSchema:
                $ref: '#/components/schemas/Event'
  /events/filtered:
    get:
      operationId: listEventsFiltered
      responses:
        '200':
          description: stream, then an empty media type, then the JSON fallback
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/Event'
            application/octet-stream: {}
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/empty-first:
    get:
      operationId: listEventsEmptyFirst
      responses:
        '200':
          description: no itemSchema at all - the legacy first-media-type rule applies
          content:
            application/octet-stream: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /events/streams:
    get:
      operationId: streamEventsMulti
      responses:
        '200':
          description: two stream formats sharing one item schema, plus a JSON fallback
          content:
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/Event'
            application/json-seq:
              itemSchema:
                $ref: '#/components/schemas/Event'
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /events/upload:
    post:
      operationId: uploadEvents
      requestBody:
        content:
          application/jsonl:
            itemSchema:
              $ref: '#/components/schemas/Event'
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: stream first, JSON fallback second
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/Event'
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatch'
  /events/ndjson:
    get:
      operationId: streamEventsNdjson
      responses:
        '200':
          description: itemSchema-only response with a unique media type name
          content:
            application/x-ndjson:
              itemSchema:
                $ref: '#/components/schemas/Ping'
  /events/normalized:
    get:
      operationId: streamEventsNormalized
      responses:
        '200':
          description: itemSchema carrying a single-entry oneOf for the normalizer to simplify
          content:
            application/json-seq:
              itemSchema:
                oneOf:
                  - $ref: '#/components/schemas/Event'
  /events/inline-stream:
    get:
      operationId: streamEventsInline
      responses:
        '200':
          description: stream-only response carrying an inline item schema
          content:
            application/jsonl:
              itemSchema:
                type: object
                properties:
                  seq:
                    type: integer
  /events/upload-stream:
    post:
      operationId: uploadEventStream
      description: stream-only request body - skipped for every generator
      requestBody:
        $ref: '#/components/requestBodies/EventStreamBody'
      responses:
        '204':
          description: accepted
  /events/subscribe:
    post:
      operationId: subscribeEvents
      callbacks:
        onData:
          '{$request.body#/callbackUrl}':
            post:
              responses:
                '200':
                  description: pushed events
                  content:
                    text/event-stream:
                      itemSchema:
                        $ref: '#/components/schemas/Event'
      responses:
        '202':
          description: subscribed
  /events/both-inline:
    get:
      operationId: getBothInline
      responses:
        '200':
          description: one media type declaring both schema and itemSchema inline, with a
            schema property literally named 'item' to exercise the suffixes
          content:
            application/json-seq:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    properties:
                      id:
                        type: string
              itemSchema:
                type: object
                properties:
                  id:
                    type: string
                  ts:
                    type: integer
webhooks:
  newEvents:
    post:
      operationId: newEventsWebhook
      responses:
        '200':
          description: pushed events
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/Event'
components:
  requestBodies:
    EventStreamBody:
      content:
        application/jsonl:
          itemSchema:
            $ref: '#/components/schemas/Event'
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
    EventBatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    Ping:
      type: object
      properties:
        seq:
          type: integer
